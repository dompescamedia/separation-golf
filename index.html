<style>
/* Layout: a 1950s ballpark scorecard. One narrow column of printed cards with offset ink shadows: hole card, your route, then the current player's team-seasons as year chips that open rosters inline. */
:root{
  --bg:#ede1c6; --card:#f8f0dc; --ink:#1d2a44; --muted:#6d6450; --line:#c9b68e;
  --green:#1d2a44; --green-ink:#f8f0dc; --fair:#e4d3a9; --pin:#d4951c; --pin-soft:#f4dfa6; --bad:#b0302a; --red:#b0302a; --shadow:#1d2a44;
  --wood:#c4843a; --scrim:rgba(29,42,68,.5); --cb:#ece0c2; --cb-row:#e0cfa6; --cb-edge:#1d2a44; --cb-ink:#2a2116; --cb-band:#b0302a; --cb-on-band:#f8f0dc; --cb-gold:#f2c94c; --bronze:#7a4f26; --bronze-hi:#b9844a; --bronze-ink:#f7e6c4; --bronze-line:#4a2f15;
  --script:"Yellowtail","Brush Script MT",cursive;
  --display:"Graduate","Rockwell","Courier New",serif;
  --body:"Bitter",Georgia,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a2c; --card:#1a2540; --ink:#f1e4c6; --muted:#a99f88; --line:#34425f;
  --green:#f1e4c6; --green-ink:#111a2c; --fair:#26324f; --pin:#efb43a; --pin-soft:#3c3318; --bad:#e86a5e; --red:#e86a5e; --shadow:#05080f;
  --wood:#d39a52; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a2c; --card:#1a2540; --ink:#f1e4c6; --muted:#a99f88; --line:#34425f;
  --green:#f1e4c6; --green-ink:#111a2c; --fair:#26324f; --pin:#efb43a; --pin-soft:#3c3318; --bad:#e86a5e; --red:#e86a5e; --shadow:#05080f;
  --wood:#d39a52; --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#main{display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 8px;flex-wrap:wrap}
.mark{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(34px,10.5vw,44px);line-height:1;color:var(--red);transform:rotate(-2deg);transform-origin:left bottom}
.mark small{display:block;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--ink);text-transform:uppercase;transform:rotate(2deg);margin-bottom:2px}
.mark .byline{color:inherit;text-decoration:none}
.mark .home{color:inherit;text-decoration:none;display:block}
.mark .byline:hover,.mark .byline:focus-visible{text-decoration:underline}
.bat{display:block;width:min(220px,56vw);height:auto;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{flex-basis:100%;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:2px}
.seg{display:flex}
.seg button{flex:1 1 0;min-width:0;white-space:nowrap;border:0;background:none;padding:7px 4px;border-radius:3px;font-family:var(--mono);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.ibtn{height:34px;min-width:34px;border:2px solid var(--ink);border-radius:4px;background:var(--card);padding:0 9px;font-family:var(--mono);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--shadow);padding:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.theme{font-family:var(--script);color:var(--red);font-size:25px;line-height:1.1}
.hole{display:flex;flex-direction:column;gap:12px}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.matchup .dots{padding-top:36px;color:var(--red)}
.dots .arrow{display:block;width:clamp(48px,15vw,72px);height:auto}
.who{min-width:0}
.who .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.who .nm{font-family:var(--display);font-weight:400;font-size:clamp(14px,4.4vw,22px);line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.who .yr{font-size:13px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.who.pin{text-align:right}
.flag{display:inline-block;width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 30%,0 60%);margin-right:4px}
.dots{font-family:var(--mono);color:var(--muted);font-size:13px}
.score{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.score div{padding:8px 6px;text-align:center;border-left:2px solid var(--ink)}
.score div:first-child{border-left:0}
.score b{display:block;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.score span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.score .rel b.over{color:var(--bad)} .score .rel b.under{color:var(--red)}
.nmbtn{display:block;margin-left:auto;border:0;background:none;padding:0;color:inherit;text-align:right;cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:4px}
.caret{font-family:var(--body);font-size:.75em;margin-left:4px;color:var(--red);text-decoration:none;display:inline-block}
.peekbtn{border:0;background:none;font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);padding:4px 0 0}
.peek{font-size:12.5px;line-height:1.3;display:grid;gap:3px;padding-top:4px;font-variant-numeric:lining-nums}
.peek .muted{white-space:nowrap}
.trail{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.trail li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;position:relative;padding-bottom:8px}
.trail li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--ink);opacity:.35}
.trail li:last-child::before{display:none}
.trail .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:lining-nums}
.trail li.cur .n{background:var(--green);color:var(--green-ink)}
.trail .t{min-width:0}
.trail .t b{font-weight:600}
.trail .via{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.xshare{display:flex;flex-direction:column;gap:6px;margin-top:10px}.xbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.btn,.diff button{border:2px solid var(--ink);background:var(--card);border-radius:4px;padding:8px 12px;font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:12.5px}
.rival{margin-top:10px;padding:8px 10px;border-left:4px solid var(--red);background:var(--bg);font-size:14px}
.rival .rv{font-family:var(--mono);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--red);margin-right:8px}
.pickpin{margin-top:14px;padding-top:12px;border-top:2px solid var(--ink)}
.pins{display:grid;gap:8px;margin:10px 0}
.pinopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--ink);background:var(--card);border-radius:4px;padding:10px 12px;position:relative;padding-left:30px}
.pinopt .flag{position:absolute;left:10px;top:13px}
.pinopt .pn{font-family:var(--display);font-size:15px}
.pinopt .py{font-size:13px;color:var(--muted)}
.score.two{grid-template-columns:1fr 1fr}
.clock{margin-top:8px;text-align:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red)}
.clock .cl{text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
.card.slim{padding-top:10px;padding-bottom:10px}
.alist{display:grid;gap:6px;margin-top:10px;max-height:60vh;overflow:auto}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;text-align:left;border:2px solid var(--ink);background:var(--card);border-radius:4px;padding:8px 10px;font-size:14px}
.arow .an{font-family:var(--mono);font-weight:700}
.arow .as{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;color:var(--red)}
.tutor{border-color:var(--red)}
.tutor p{margin:.4em 0}
.tutor .term{font-family:var(--script);color:var(--red);font-size:44px;line-height:1.1}
.chip.tut,.pbtn.tut{outline:3px solid var(--pin);outline-offset:2px;animation:tutglow 1.2s ease-in-out infinite}
@keyframes tutglow{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.chip.tut,.pbtn.tut{animation:none}}
.nextin{font-family:var(--mono);font-size:13px;color:var(--muted);margin:2px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.nextin b{color:var(--ink)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn .cost{font-size:11px;color:var(--muted);margin-left:4px}
.mball{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fbf8ef;border:1.5px solid var(--ink);margin-right:6px;vertical-align:-1px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
.mball.used{background:transparent;box-shadow:none;opacity:.45}
.btn.primary .cost{color:inherit;opacity:.8}
.now h2{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.05;text-transform:uppercase}
.teams{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.team{display:flex;flex-direction:column;gap:6px}
.team .tn{font-family:var(--display);font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.years{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink);background:var(--card);border-radius:3px;padding:5px 9px;font-weight:600;font-size:14px;font-variant-numeric:lining-nums tabular-nums}
.chip[aria-expanded="true"]{background:var(--green);color:var(--green-ink)}
.chip.locked{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.chip.hint{box-shadow:0 0 0 2px var(--pin)}
/* Result-screen subheadings (Dom, 2026-10-21): bold and plain instead of spaced-out typewriter caps. */
.result .eyebrow{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--ink)}
.rcount{margin:10px 0 4px}.rcrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.rcrow>div{border:1.5px solid var(--line);border-radius:4px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.rcrow b{font-size:18px;font-variant-numeric:lining-nums tabular-nums;line-height:1.15}.rcrow span{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column}.rcrow i{font-style:normal;font-weight:700;color:var(--ink);line-height:1.2}
.roster{border:2px solid var(--ink);border-radius:4px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.rtools{display:flex;flex-wrap:wrap;gap:6px}.rtools input{flex:1 1 170px;min-width:0}
.rtools select{flex:1 1 130px;min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:0 8px}
.roster input,.tsearch input,.search input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:9px 10px;font:inherit;color:var(--ink)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;max-height:340px;overflow:auto}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 9px;min-width:0}
.pbtn:hover{border-color:var(--ink)}
.pbtn .pn{font-weight:600;font-size:13.5px;line-height:1.2;overflow-wrap:anywhere}
.pbtn .py{font-size:12px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.pbtn.target{background:var(--pin-soft);border:2px solid var(--red)}
.pbtn.seen{opacity:.5}
.tsearch{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.loading{padding:40px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button{padding:6px 10px}

<script>
const BASE_URL = "https://separationgolf.com/";
const LAUNCH = "2026-10-15";
const MINY = 1871, MAXY = 2026;
let P, TN, T, PT, NP, NT, FR, ID2;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function rngFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// BFS over the player <-> team-season graph, optionally limited to allowed team-seasons.
function bfs(src,allow){
  const dist=new Int16Array(NP).fill(-1), parP=new Int32Array(NP).fill(-1), parT=new Int32Array(NP).fill(-1);
  const tseen=new Uint8Array(NT), q=new Int32Array(NP); let h=0,tl=0; q[tl++]=src; dist[src]=0;
  while(h<tl){const u=q[h++];for(const ti of PT[u]){if(tseen[ti]||(allow&&!allow[ti]))continue;tseen[ti]=1;
    for(const v of T[ti][2]){if(dist[v]<0){dist[v]=dist[u]+1;parP[v]=u;parT[v]=ti;q[tl++]=v}}}}
  return {dist,parP,parT};
}
// Of all routes tied for shortest, the one whose players add up to the most career WAR (players[i][10], tenths). Dom, 2026-10-18.
// low=true gives the Deep Cut instead: the shortest route with the least WAR in between.
function warPath(a,b,allow,low){const db=bfs(b,allow).dist;if(db[a]<0)return null;
  const sg=low?-1:1,W=p=>sg*(P[p][10]||0),memo=new Map(),nxt=new Map();
  const f=v=>{if(v===b)return W(b);if(memo.has(v))return memo.get(v);let best=-Infinity,bn=null;
    for(const ti of PT[v]){if(allow&&!allow[ti])continue;for(const u of T[ti][2])if(db[u]===db[v]-1){const s=f(u);if(s>best){best=s;bn={p:u,t:ti}}}}
    const r=W(v)+best;memo.set(v,r);nxt.set(v,bn);return r};
  const total=sg*f(a),out=[];let v=a;while(v!==b){const n=nxt.get(v);out.push(n);v=n.p}out.war=total/10;out.mid=(total-(P[a][10]||0)-(P[b][10]||0))/10;return out}
// Daily "Deep Cut" route rank (Dom, 2026-10-19): fewer jumps first, then lowest combined career WAR of the players in between.
// Rank = 1 + routes that beat yours; same WAR is a tie; past 500 it just says 500+.
const RANK_CAP=500;
function routeRank(h){const ids=h.trail.map(st=>st.p),a=h.a,b=h.b,allow=h.allow,L=ids.length-1;
  if(L<1||ids[L]!==b||new Set(ids).size!==ids.length)return null;
  const W=p=>P[p][10]||0,w=ids.slice(1,-1).reduce((s,p)=>s+W(p),0),db=bfs(b,allow).dist,teams=u=>allow?PT[u].filter(ti=>allow[ti]):PT[u];
  // f[k][u]: lower bound on the WAR still to come from u with k jumps left (a walk, so it never overestimates).
  const INF=1e9,f=[];let x=new Float64Array(NP).fill(INF);x[b]=0;
  for(let k=1;k<L;k++){const m=new Float64Array(NT).fill(INF);
    for(let ti=0;ti<NT;ti++){if(allow&&!allow[ti])continue;let mn=INF;for(const v of T[ti][2])if(x[v]<mn)mn=x[v];m[ti]=mn}
    const fk=new Float64Array(NP).fill(INF);for(let u=0;u<NP;u++){let mn=INF;for(const ti of PT[u])if(m[ti]<mn&&(!allow||allow[ti]))mn=m[ti];fk[u]=mn}
    f[k]=fk;const nx=new Float64Array(NP).fill(INF);for(let u=0;u<NP;u++)if(u!==b&&fk[u]<INF)nx[u]=W(u)+fk[u];x=nx}
  const seen=new Uint8Array(NP),mark=new Int32Array(NP);let stamp=0,better=0,ties=0,ops=0;
  const nbrs=u=>{const st=++stamp,out=[];mark[u]=st;for(const ti of teams(u))for(const v of T[ti][2])if(mark[v]!==st){mark[v]=st;out.push(v)}return out};
  // Walk every route of exactly len jumps, counting the ones that beat (or tie) yours.
  const walk=(u,k,s,len)=>{if(better>=RANK_CAP||++ops>4e6)return;
    if(k===1){if(len<L||s<w)better++;else if(s===w)ties++;return}
    for(const v of nbrs(u)){if(v===b||seen[v]||db[v]<0||db[v]>k-1)continue;const s2=s+W(v);
      if(len===L&&s2+f[k-1][v]>w)continue;
      seen[v]=1;walk(v,k-1,s2,len);seen[v]=0;if(better>=RANK_CAP)return}};
  for(let len=h.best;len<=L&&better<RANK_CAP;len++){seen[a]=1;if(len===1){if(L>1)better++;else ties++}else walk(a,len,0,len);seen[a]=0}
  if(ops>4e6)return null;
  return{rank:better+1,over:better>=RANK_CAP,tied:ties>1,war:w/10}}
const rankTxt=r=>r.over?RANK_CAP+"+":(r.tied?"Tied for #":"#")+r.rank;
function shortestPath(a,b,allow){const r=bfs(a,allow);if(r.dist[b]<0)return null;const out=[];let v=b;
  while(v!==a){out.push({p:v,t:r.parT[v]});v=r.parP[v]}out.reverse();return out}

// Limits on a hole: C = {from, to, strict (route must stay in those years), fr (franchise list, route must stay on them)}
const allYears=C=>!C||(C.from<=MINY&&C.to>=MAXY);
const inYears=(ti,C)=>!C||(T[ti][0]>=C.from&&T[ti][0]<=C.to);
const inTeams=(ti,C)=>!C||!C.fr||!C.fr.length||C.fr.includes(T[ti][3]);
function allowFor(C){if(!C)return null;const yr=C.strict&&!allYears(C),tm=C.fr&&C.fr.length;if(!yr&&!tm)return null;
  const al=new Uint8Array(NT);for(let i=0;i<NT;i++)if((!yr||inYears(i,C))&&inTeams(i,C))al[i]=1;return al}
// Players worth drawing from under the limits. Well-known players carry more weight in the draw.
function poolFor(C){const need=(C?C.to-C.from:99)>=3?2:1,out=[],extra=[];
  for(let i=0;i<NP;i++){let n=0;for(const ti of PT[i])if(inYears(ti,C)&&inTeams(ti,C))n++;if(n<need)continue;(P[i][4]?out:extra).push(i)}
  for(const i of extra){if(out.length>=40)break;out.push(i)}return out}
const weight=i=>Math.pow(P[i][4]||1,1.6);
function wpick(arr,rng){let tot=0;for(const i of arr)tot+=weight(i);let x=rng()*tot;for(const i of arr){x-=weight(i);if(x<=0)return i}return arr[arr.length-1]}
const mid=i=>(P[i][1]+P[i][2])/2;
// Older player tees off, younger player is the pin. Birth year first, debut year as a fallback.
const ageKey=i=>(P[i][7]||P[i][1]-23)*10000+P[i][1];
const isOlder=(x,y)=>ageKey(x)<ageKey(y);
const seasons=i=>new Set(PT[i].map(ti=>T[ti][0])).size;
function pickPair(rng,o){
  const full=poolFor(o.C),allow=allowFor(o.C);let pool=full;
  if(o.minFame){const top=full.filter(i=>P[i][4]>=o.minFame);if(top.length>=40)pool=top}
  if(o.teeOk){const t=pool.filter(o.teeOk);if(t.length)pool=t}
  const bpool=o.pinOk?full:pool,g0=o.gap||0;
  const passes=o.strictOnly?[[o.lo,o.hi,g0]]:[[o.lo,o.hi,g0],[o.lo,o.hi,0],[Math.max(1,o.lo-1),o.hi+2,0],[1,99,0]];
  for(const [l,h,g] of passes){
    for(let tries=0;tries<(o.tee!=null?1:40);tries++){
      const a=o.tee!=null?o.tee:wpick(pool,rng),{dist}=bfs(a,allow);
      const c=bpool.filter(b=>b!==a&&dist[b]>=l&&dist[b]<=h&&Math.abs(mid(a)-mid(b))>=g&&(!o.pinOk||(isOlder(a,b)&&o.pinOk(b))));
      if(c.length)return [a,wpick(c,rng)];
    }
  }
  return o.strictOnly?null:[pool[0],pool[1]];
}

// Dates roll over at midnight US Eastern so everyone shares the same puzzle.
function etDate(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
  catch(e){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}}
const weekday=s=>new Date(s+"T12:00:00Z").getUTCDay();
const prevDay=s=>{const d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)};
const dayNum=s=>Math.round((new Date(s+"T12:00:00Z")-new Date(LAUNCH+"T12:00:00Z"))/864e5)+1;
const fmtDate=s=>new Date(s+"T12:00:00Z").toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"UTC"});

// Hand-picked days, keyed MM-DD. Anything not listed is generated automatically.
const SPECIALS={"04-15":{label:"Jackie Robinson Day",tee:"robinja02"}};
const knownOr2000s=b=>P[b][4]>=12||(P[b][2]>=2000&&seasons(b)>=6);
const PLAN={};
// Hand-picked Dailies by date (Eastern): [tee, pin] as player IDs.

const played70s=i=>PT[i].some(ti=>T[ti][0]>=1970&&T[ti][0]<=1979);
// Daily 9: well-known All-Stars from the 1970s tee off (true legends allowed on holes 5 and 9); the pin played recently.
const roundTee=(i,legends)=>(played70s(i)&&P[i][4]>=18)||(legends&&P[i][2]<1970&&P[i][4]>=50);
const roundPin=i=>P[i][2]>=2018&&P[i][4]>=14;
// Daily 9 holes pinned by date. 2026-10-18 is frozen to what it was before 2026 rosters were added mid-day.
const ROUND_SET={"2026-10-18":"morrija02>cabreas01 dawsoan01>acunaro01 robinbr01>harpebr03 brettge01>blackch02 boudrlo01>freemfr01 benchjo01>zobribe01 raineti01>lindofr01 robinfr02>judgeaa01 aaronha01>skenepa01"};
function roundPlan(d,i){const k=d+":"+i;if(PLAN[k])return PLAN[k];
  if(ROUND_SET[d]){const pr=ROUND_SET[d].split(" ")[i].split(">").map(x=>ID2.get(x));if(pr.every(x=>x!=null))return PLAN[k]={pair:pr,C:null}}const [lo,hi]=ROUND_BANDS[i];

  const used=new Set(dailyPlan(d).pair);for(let j=0;j<i;j++)roundPlan(d,j).pair.forEach(x=>used.add(x));
  return PLAN[k]={pair:pickPair(rngFrom("round2:"+k),{lo,hi,teeOk:p=>!used.has(p)&&roundTee(p,i===4||i===8),pinOk:p=>!used.has(p)&&roundPin(p)}),C:null}}
const DIFFS={easy:{label:"Easy",lo:2,hi:2},medium:{label:"Medium",lo:3,hi:3},hard:{label:"Hard",lo:4,hi:5},legend:{label:"Legend",lo:6,hi:12}};

const S={hallOpen:new Set(),hallQ:{},hallT:{},clockOn:!!store.get("clock"),dir:store.get("dir")==="young"?"young":"old",mode:"daily",hole:null,open:-1,filter:"",tq:"",peek:{},diff:"medium",tally:{holes:0,over:0},rd:null,

// dir: "old" = older player tees off (default), "young" = younger player tees off, "keep" = order as given
function newHole(a,b,kind,meta,C,saveKey,dir){

  S.hole={a,b,kind,meta,C,allow,distT:toT.dist,best:toT.dist[a],par:toT.dist[a]+2,trail:[{p:a,t:-1}],strokes:0,hints:0,hintTeam:-1,done:false,gaveUp:false,saveKey};

  if(S.clockOn&&(kind==="endless"||kind==="custom")&&!S.hole.done)S.hole.clock={t0:Date.now(),ticks:0};

}
function clockTxt(){const h=S.hole,ms=60000-(Date.now()-h.clock.t0)%60000,sec=Math.ceil(ms/1000)%60||60;return`<span class="cl">Shot clock</span> ${sec===60?"1:00":"0:"+String(sec).padStart(2,"0")}${h.clock.ticks?` · ${h.clock.ticks} added`:""}`}
setInterval(()=>{const h=S.hole;if(!h||!h.clock||h.done)return;

  const sb=$("#scorebox");if(!sb)return;
  if(changed){toast("Shot clock. +1 stroke");save();const cv=$("#clockv");sb.outerHTML=scoreHTML();if(cv)cv.remove()}
  else{const cv=$("#clockv");if(cv)cv.innerHTML=clockTxt()}},1000);
function save(){const h=S.hole;if(!h||!h.saveKey)return;if(h.meta.late){const o=store.get(h.saveKey);if(o&&!o.late)h.meta.late=false}store.set(h.saveKey,{a:P[h.a][3],b:P[h.b][3],trail:h.trail,strokes:h.strokes,hints:h.hints,done:h.done,gaveUp:h.gaveUp,par:h.par,mullUsed:!!h.mullUsed,n:h.n,late:h.meta.late||undefined,clk:h.clock?h.clock.ticks:undefined,hard:h.hard||undefined,rk:h.rk})}
const hardLive=()=>{const h=S.hole;return!!(h&&h.kind==="daily"&&h.hard&&!h.done)};

function startDaily(d){const today=etDate();d=d||today;const pl=dailyPlan(d);newHole(pl.pair[0],pl.pair[1],"daily",{date:d,n:dayNum(d),label:pl.label,late:d!==today},pl.C,"daily:"+d)}
function etLeft(){try{const f=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hourCycle:"h23",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date()),g=t=>+f.find(x=>x.type===t).value;
  const l=86400-(g("hour")*3600+g("minute")*60+g("second"));return`${Math.floor(l/3600)}h ${String(Math.floor(l%3600/60)).padStart(2,"0")}m ${String(l%60).padStart(2,"0")}s`}catch(e){return"midnight Eastern"}}

function pinChoices(){const D=DIFFS[S.diff],C=S.range;
  for(let k=0;k<12;k++){const pr=pickPair(Math.random,{lo:D.lo,hi:D.hi,C,strictOnly:true});if(!pr)continue;

  const yt=(p,y,q)=>PT[p].find(ti=>T[ti][0]===y&&T[ti][2].includes(q));let chip,pl;

function startEndless(){const [a,b]=pickPair(Math.random,{lo:DIFFS[S.diff].lo,hi:DIFFS[S.diff].hi,C:S.range});newHole(a,b,"endless",{diff:S.diff},{...S.range},null,S.dir)}

// Stroke limit: the score stops at MAXS, but you can keep playing to finish.
const MAXS=10;
function bump(h,k){if(h.kind==="range")return;const was=h.strokes;h.n=(h.n??h.strokes)+k;h.strokes=Math.max(0,Math.min(h.n,MAXS));
  if(k>0&&was<MAXS&&h.strokes===MAXS&&!h.done)toast("Stroke limit. Your score stays at 10, so finish if you want to")}
function jump(p,t){const h=S.hole;if(h.done)return;
  h.trail.push({p,t});bump(h,1);S.open=-1;S.filter="";S.tq="";h.hintTeam=-1;

function back(){const h=S.hole;if(h.done||h.trail.length<2)return;const prev=h.trail[h.trail.length-2];
  h.trail.push({p:prev.p,t:-2});bump(h,1);S.open=-1;h.hintTeam=-1;save();render()}

// Mulligan: take back the last move for free. One per hole, or one for the whole Daily 9.
const roundMull=d=>store.get("mull:"+d);
const mullLeft=()=>{const h=S.hole;return h.kind==="round"?!roundMull(h.meta.date):!h.mullUsed};

function welcomeHTML(){return`<h2 class="mtitle wt" id="mtitle">Welcome to Separation Golf</h2>
  <p>Get from the <b>tee</b> player to the <b>pin</b> by jumping teammate to teammate. Tap a season, pick a teammate. Each jump is a stroke.</p>
  <div class="scoring row3"><div><b>Eagle</b><span>shortest route</span></div><div><b>Birdie</b><span>+1 jump</span></div><div><b>Par</b><span>+2 jumps</span></div></div>
  <p class="small">Hints and going back cost a stroke. One free <b>Mulligan</b> a hole (not on the Daily). Scores stop at 10.</p>
  <p class="small"><b>Deep Cut rank</b> on the Daily: strokes first, then the least career WAR. Then see how everyone scored. Hole it daily for a <b>streak</b>.</p>
  <ul class="small tight"><li><b>Daily</b> one hole for everyone, new at midnight ET. <b>Hard mode</b> and the <b>Archive</b> are on the Daily bar.</li>
  <li><b>Daily 9</b> nine holes, tougher as you go.</li>

  <div class="actions"><button class="btn primary" id="playball">Play ball</button><button class="btn" id="tutor2">Tutorial</button></div>

// Streak = Dailies holed on the day, in a row (archive plays don't count).
function dailyStreak(){const ok=d=>{const r=store.get("daily:"+d);return r&&r.done&&!r.gaveUp&&!r.late};
  let d=etDate();if(!ok(d))d=prevDay(d);let streak=0;while(ok(d)){streak++;d=prevDay(d)}
  let best=0;try{const ds=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("daily:")&&ok(k.slice(6)))ds.push(k.slice(6))}ds.sort();let run=0,prev=null;
    for(const x of ds){run=prev&&prevDay(x)===prev?run+1:1;best=Math.max(best,run);prev=x}}catch(e){}
  return{streak,best}}
function statsHTML(){
  const recs=[],rounds={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("daily:"))recs.push(store.get(k));
    else if(k.startsWith("round:")){const [,d,n]=k.split(":");(rounds[d]=rounds[d]||[])[+n]=store.get(k)}}}catch(e){}
  let played=0,fin=0,sum=0;const dist={};
  for(const r of recs){if(!r||!r.done||r.par==null)continue;played++;const t=r.gaveUp?"Picked up":term(r.strokes-r.par,r.strokes);dist[t]=(dist[t]||0)+1;if(!r.gaveUp){fin++;sum+=r.strokes-r.par}}
  const {streak,best}=dailyStreak(),ranks=recs.filter(r=>r&&r.rk&&!r.gaveUp).map(r=>r.rk),bestRk=ranks.length?ranks.reduce((x,y)=>y.rank<x.rank?y:x):null;
  const full=Object.values(rounds).filter(a=>a.length===9&&a.every(r=>r&&r.done)).map(a=>roundTotals(a)),bestR=full.length?Math.min(...full.map(t=>t.st-t.par)):null;
  const order=["Hole in one","Eagle","Birdie","Par","Bogey","Double bogey","Triple bogey"],keys=[...order.filter(k=>dist[k]),...Object.keys(dist).filter(k=>!order.includes(k)&&k!=="Picked up"),...(dist["Picked up"]?["Picked up"]:[])];
  const max=Math.max(1,...Object.values(dist));
  return`<h2 class="mtitle" id="mtitle">Your stats</h2>
  <div class="tiles"><div class="tile"><b>${played}</b><span>Dailies</span></div><div class="tile"><b>${played?Math.round(fin/played*100):0}%</b><span>Holed out</span></div><div class="tile"><b>${streak}</b><span>Streak</span></div><div class="tile"><b>${best}</b><span>Best streak</span></div></div>
  <p class="small">${fin?`Average on the Daily: ${relTxt(Math.round(sum/fin*10)/10)} to par.`:"Finish a Daily to start your record."} ${bestRk?`Best Deep Cut rank: ${rankTxt(bestRk)}.`:""} ${full.length?`Daily 9 rounds finished: ${full.length}, best ${relTxt(bestR)}.`:""}</p>
  ${keys.length?`<h3>Daily scores</h3><div class="bars">${keys.map(k=>`<span>${k}</span><div class="bar" style="width:${Math.round(dist[k]/max*100)}%"></div><span>${dist[k]}</span>`).join("")}</div>`:""}
  <p class="small muted">Stats are saved on this device.</p>`}

function setMode(m){S.mode=m;

  else if(m==="range"){if(!S.hole||S.hole.kind!=="range")startRange()}
  render();window.scrollTo({top:0})}

function fromHash(){const m=location.hash.match(/^#ch\.([a-z0-9]+)\.([a-z0-9]+)((?:\.[a-z0-9-]+)*)$/i);if(!m)return false;
  const a=ID2.get(m[1]),b=ID2.get(m[2]);if(a==null||b==null||a===b)return false;
  let C=null,rival=null;for(const seg of m[3].split(".").filter(Boolean)){const y=seg.match(/^y(\d{4})-(\d{4})$/),t=seg.match(/^t([\d-]+)$/),r=seg.match(/^r(\d+)-([a-z0-9-]+)$/i);
    if(r){let ids=r[2].split("-").map(x=>ID2.get(scr(x,-1)));if(ids.some(x=>x==null))ids=r[2].split("-").map(x=>ID2.get(x));if(ids.length&&ids.every(x=>x!=null)&&ids[ids.length-1]===b)rival={strokes:+r[1],ids}}
    if(y){C=C||{from:MINY,to:MAXY,strict:true};C.from=+y[1];C.to=+y[2]}
    if(t){C=C||{from:MINY,to:MAXY,strict:true};C.fr=t[1].split("-").map(Number).filter(n=>n<FR.length)}}
  S.mode="custom";S.custom.a=a;S.custom.b=b;if(C&&C.fr){S.custom.tmode=C.fr.length===1?"one":"multi";S.custom.fr=[...C.fr]}
  newHole(a,b,"custom",{},C,null,"keep");S.hole.rival=rival;render();return true}
