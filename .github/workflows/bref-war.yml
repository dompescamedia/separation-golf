name: Refresh career WAR
on:
  workflow_dispatch:
  push:
    paths: [tools/bref_war.py, .github/workflows/bref-war.yml]
permissions:
  contents: write
jobs:
  war:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/bref_war.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add war.json
          git diff --cached --quiet || (git commit -m "Refresh career WAR" && git push)
